[project]
site_name = "toonarmycaptain's blog"
site_url = "https://blog.toonarmycaptain.com/"
site_description = "toonarmycaptain's blog."
site_author = "toonarmycaptain"
docs_dir = "docs"
site_dir = "site"
# shared/ and overrides/partials/ are generated by scripts/generate_header_footer.py.
extra_css = ["shared/header_footer.css", "stylesheets/blog.css"]

[project.theme]
custom_dir = "overrides"
favicon = "shared/favicon.ico"
language = "en"

[project.plugins.blog]
blog_dir = "."
post_url_format = "{slug}"

[project.plugins.tags]

[project.plugins.rss]
match_path = "posts/.*"
# Posts in the feed; 0 means none, not unlimited, so this is "all of them".
length = 999

[project.plugins.rss.date_from_meta]
as_creation = "date"
as_update = "date"

# Zensical's defaults (setting this table replaces them), plus mdx_breakless_lists.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
# Lets a list start straight after a line of text, as in CommonMark (dev.to, GitHub, PyCharm's
# preview). Python-Markdown otherwise needs a blank line first.
mdx_breakless_lists = {}
