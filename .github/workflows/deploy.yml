# Builds the blog and deploys it to the Cloudflare Pages project toonarmycaptain-blog.
#
# Runs on pushes to master, and from the "Run workflow" button. toonarmycaptain_website's
# rebuild_blog.yml presses that button through the GitHub API when the website's master changes, so
# the blog picks up header and footer changes. This repo's publish_scheduled_posts.yml presses it
# when a future-dated post's time comes, and the scheduled-posts job below turns that workflow on
# and off.
#
# Runs on master deploy to production. A manual run on another branch makes a preview deploy at
# <branch>.toonarmycaptain-blog.pages.dev.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily rebuild at 05:00 US Central Standard Time (11:00 UTC). GitHub cron is always UTC and does
  # not follow daylight saving, so from spring to autumn (CDT) this fires at 06:00 Central.
  schedule:
    - cron: "0 11 * * *"

# One deploy at a time. A run started while another is going waits, and replaces any already waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install
        run: uv sync --locked

      - name: Lint posts
        run: uv run pre-commit run --all-files

      - name: Header and footer from toonarmycaptain_website
        run: uv run python scripts/generate_header_footer.py

      - name: Build
        run: uv run zensical build

      - name: Podcast app image in the RSS feeds
        run: uv run python scripts/add_itunes_image.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: pages deploy site --project-name=toonarmycaptain-blog --branch=${{ github.ref_name }}

  # Turns publish_scheduled_posts.yml on while a future-dated post is waiting, and off once none are.
  # Separate from the deploy, so it still runs if the build fails. When it turns the check on, it
  # also starts one, so a post due in the next few minutes doesn't wait for the next scheduled check.
  scheduled-posts:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # turn publish_scheduled_posts.yml on and off, and start it
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Turn the scheduled posts check on or off
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upcoming=$(uv run scripts/scheduled_posts.py upcoming)
          if [ -n "$upcoming" ]; then
            echo "Future-dated posts, so the check is on:"
            echo "$upcoming"
            gh workflow enable publish_scheduled_posts.yml
            gh workflow run publish_scheduled_posts.yml --ref master
          else
            echo "No future-dated posts, so the check is off."
            # GitHub refuses to disable a workflow that's already off, so only disable it if it's on.
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish_scheduled_posts.yml" --jq .state)
            if [ "$state" = active ]; then
              gh workflow disable publish_scheduled_posts.yml
            fi
          fi
